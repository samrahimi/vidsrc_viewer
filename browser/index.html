<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vlix: Premium Streaming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <!-- Native App Recommendation Banner -->
    <div id="native-app-banner" class="hidden">
        <div class="banner-content">
            <i class="fas fa-mobile-alt banner-icon"></i>
            <p class="banner-text">
                <strong>Get the best experience!</strong> Install the native app for <span id="banner-os-name">your
                    device</span> to enjoy 100% ad-free streaming without popups.
            </p>
        </div>
        <div class="banner-actions">
            <a href="https://vlix.ai" target="_blank" class="btn-banner">Get App</a>
            <button id="close-banner" class="banner-close" aria-label="Close">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <div class="app-container">
        <header class="main-header">
            <a href="#/" class="logo" aria-label="Vlix home">Vlix<span class="accent">.</span></a>

            <nav class="main-nav" aria-label="Browse">
                <a href="#/" data-nav="home">Home</a>
                <a href="#/movies" data-nav="movies">Movies</a>
                <a href="#/tv" data-nav="tv">TV Shows</a>
            </nav>

            <div class="search-container">
                <div class="search-wrapper">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search movies & TV shows..." autocomplete="off">
                    <button id="search-clear" class="search-clear hidden" aria-label="Clear search">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="header-actions">
                <div id="app-badge" class="badge hidden">
                    <span class="badge-dot"></span> Desktop App
                </div>
                <button id="surprise-btn" class="header-btn" title="Surprise me" aria-label="Surprise me">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 3 21 3 21 8"></polyline>
                        <line x1="4" y1="20" x2="21" y2="3"></line>
                        <polyline points="21 16 21 21 16 21"></polyline>
                        <line x1="15" y1="15" x2="21" y2="21"></line>
                        <line x1="4" y1="4" x2="9" y2="9"></line>
                    </svg>
                    <span class="header-btn-label">Surprise me</span>
                </button>
                <a href="#/history" class="header-btn" data-nav="history" title="Watch history" aria-label="Watch history">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span class="header-btn-label">History</span>
                </a>
                <a href="#/list" class="header-btn" data-nav="list" title="My List" aria-label="My List">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span class="header-btn-label">My List</span>
                    <span id="list-count" class="count-badge hidden"></span>
                </a>
                <button id="fullscreen-toggle" class="btn-icon hidden" aria-label="Toggle Fullscreen">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3">
                        </path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Each route (home, movies, tv, list, history, search, browse grids) renders into here -->
        <main id="view-root" class="content-area"></main>

        <footer class="main-footer">
            <p>Questions or feedback? Email us at <a style="color:white" href="mailto:germanegerbil@gmail.com">germanegerbil@gmail.com</a></p>
        </footer>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <button id="close-modal" class="close-modal">×</button>
            <div id="modal-body"></div>
        </div>
    </div>
    <!-- jQuery: must go before app.js  -->
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="longTermMemory.js"></script>

    <!-- app.js - entry point is initApp on document ready-->
    <script src="config.js"></script>
    <script src="episodes.js"></script>
    <script src="app.js"></script>


    <script>
        $(document).ready(function () {
            console.log("Document is ready!");
        });
    </script>
    <!-- Onboarding Integration -->
    <div id="onboarding-container" class="hidden"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: #141414;">
        <iframe id="onboarding-iframe" src="onboarding.html" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>

    <!-- Chatbot Integration -->
    <div id="chat-iframe-container" class="hidden">
        <iframe id="chat-iframe" data-src="chat.html"></iframe>
    </div>
    <button id="chat-fab" aria-label="Open Chat" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </button>

    <script>
        const chatFab = document.getElementById('chat-fab');
        const chatContainer = document.getElementById('chat-iframe-container');

        chatFab.addEventListener('click', () => {
            const isHidden = chatContainer.classList.contains('hidden');
            if (isHidden) {
                chatContainer.classList.remove('hidden');
                chatFab.classList.add('active');
                // Change icon to X
                chatFab.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
            } else {
                chatContainer.classList.add('hidden');
                chatFab.classList.remove('active');
                // Change icon back to chat
                chatFab.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>';
            }
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    }, err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>

</html>
