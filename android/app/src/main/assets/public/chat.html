<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatflix Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #e50914;
            --bg-color: #141414;
            --surface-color: #1f1f1f;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
            --border-radius: 12px;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--surface-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px;
            background-color: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .header-title {
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title svg {
            color: var(--primary-color);
        }

        #new-chat-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-color);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        #new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--primary-color);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
            /* Allow wider messages for tiles */
            max-width: 95%;
        }

        .message.system {
            align-self: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: none;
            text-align: center;
        }

        .message a {
            color: #4da6ff;
            text-decoration: none;
            border-bottom: 1px solid rgba(77, 166, 255, 0.3);
            transition: all 0.2s;
        }

        .message a:hover {
            border-bottom-color: #4da6ff;
        }

        .chat-input-container {
            padding: 16px;
            background-color: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
        }

        #chat-input {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 12px 20px;
            color: white;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        #chat-input:focus {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        #send-btn {
            background-color: var(--primary-color);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            transition: transform 0.2s, background-color 0.2s;
        }

        #send-btn:hover {
            background-color: #f40612;
            transform: scale(1.05);
        }

        #send-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 8px;
            align-items: center;
            height: 24px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Chat Feed Item Styles */
        .chat-feed-item {
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 80%;
            /* Wider tile */
            text-align: center;
            /* Center text content */
        }

        .chat-media-card {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: #1a1a1a;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            width: 100%;
            aspect-ratio: 2/3;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 6px;
            /* Reduced margin */
        }

        .chat-media-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .chat-card-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Overlay only for actions now, not title */
        .chat-card-overlay {
            display: none;
        }

        .chat-card-actions {
            position: absolute;
            top: 4px;
            right: 4px;
            display: flex;
            gap: 4px;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .chat-media-card:hover .chat-card-actions {
            opacity: 1;
        }

        .chat-btn-icon-small {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: white;
            width: 28px;
            /* Slightly larger touch target */
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;


            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .chat-btn-icon-small:hover {
            background: var(--primary-color);
            transform: scale(1.1);
        }

        .chat-caption {
            font-size: 0.95rem;
            text-align: center;
            /* Actually, for a centered card, centered text usually looks better. */
        }

        .chat-title {
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-year {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .chat-description {
            font-size: 0.85rem;
            color: #ccc;
            /* Reduced margin 
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            */
            overflow: auto;
            text-align: left;
            /* Description should probably be left aligned for readability */
        }
    </style>
</head>

<body>
    <header class="chat-header">
        <div class="header-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            Chatflix AI
        </div>
        <button id="new-chat-btn" class="icon-btn" aria-label="New Chat" title="Start New Conversation">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
    </header>

    <div class="chat-messages" id="messages-container">
        <div class="message assistant">
            Hello! I'm your Chatflix concierge. I can help you find movies and TV shows to watch. What are you in the
            mood for?
        </div>
    </div>

    <div class="chat-input-container">
        <input type="text" id="chat-input" placeholder="Ask for a movie..." autocomplete="off">
        <button id="send-btn" aria-label="Send">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>

    <script src="chat.js"></script>
</body>

</html>
