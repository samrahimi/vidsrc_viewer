<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch - Vidsrc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .player-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
            width: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        .info-panel {
            padding: 1rem;
            background: #111;
            overflow-y: auto;
            max-height: 30vh;
        }

        .info-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
        }

        .info-meta {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 0.5rem;
        }

        .btn-nav {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Outfit', sans-serif;
        }

        .btn-nav:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Landscape Mode: Full Screen Player */
        @media (orientation: landscape) {

            .controls,
            .info-panel {
                display: none;
            }

            .player-container {
                height: 100vh;
            }
        }
    </style>
</head>

<body>

    <div class="controls">
        <button id="back-btn" class="btn-nav">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back
        </button>
        <button id="home-btn" class="btn-nav">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            Home
        </button>
    </div>

    <div class="player-container">
        <iframe id="video-player" allowfullscreen></iframe>
    </div>

    <div class="info-panel" id="info-panel">
        <h2 class="info-title" id="title">Loading...</h2>
        <div class="info-meta">
            <span id="year"></span> • <span id="runtime"></span>
        </div>
        <p id="overview" style="font-size: 0.9rem; line-height: 1.4; color: #ccc;"></p>
    </div>

    <script>
        const API_KEY = "829a43a98259bc44cae297489c7e3bba";
        const BASE_URL = "https://api.themoviedb.org/3";

        const urlParams = new URLSearchParams(window.location.search);
        const tmdbId = urlParams.get('tmdbId');
        const type = urlParams.get('type');

        const player = document.getElementById('video-player');
        const backBtn = document.getElementById('back-btn');
        const homeBtn = document.getElementById('home-btn');

        // Set Player URL
        (async () => {
            await window.loadConfig(); // Load config first (even if we rely on defaults, good practice)

            if (tmdbId && type) {
                let template = type === 'movie'
                    ? window.AppConfig.playerUrlTemplateMovie
                    : window.AppConfig.playerUrlTemplateTv;

                const path = template.replace('{tmdbId}', tmdbId);
                player.src = `https://${path}`;

                fetchDetails(tmdbId, type);
            }
        })();

        // Navigation
        backBtn.addEventListener('click', () => {
            window.history.back();
        });

        homeBtn.addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        async function fetchDetails(id, type) {
            try {
                const response = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}`);
                const data = await response.json();

                const title = data.title || data.name;
                const year = (data.release_date || data.first_air_date || '').split('-')[0];
                let runtime = '';

                if (type === 'movie') {
                    runtime = data.runtime ? `${data.runtime}m` : '';
                } else {
                    if (data.episode_run_time && data.episode_run_time.length > 0) {
                        runtime = `${data.episode_run_time[0]}m`;
                    }
                }

                document.getElementById('title').textContent = title;
                document.getElementById('year').textContent = year;
                document.getElementById('runtime').textContent = runtime;
                document.getElementById('overview').textContent = data.overview;

            } catch (e) {
                console.error("Error fetching details", e);
            }
        }
    </script>
</body>

</html>
